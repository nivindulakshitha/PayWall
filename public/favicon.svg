<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#10b981"/>
      <stop offset="100%" style="stop-color:#059669"/>
    </linearGradient>
  </defs>
  <!-- Rounded background -->
  <rect width="64" height="64" rx="14" fill="url(#bg)"/>
  <!-- Calculator body -->
  <rect x="14" y="10" width="36" height="44" rx="4" fill="white" opacity="0.95"/>
  <!-- Screen -->
  <rect x="18" y="14" width="28" height="12" rx="2" fill="#064e3b"/>
  <!-- Rs. text on screen -->
  <text x="32" y="24" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#34d399">Rs.</text>
  <!-- Calculator buttons row 1 -->
  <rect x="18" y="30" width="6" height="5" rx="1" fill="#d1fae5"/>
  <rect x="26" y="30" width="6" height="5" rx="1" fill="#d1fae5"/>
  <rect x="34" y="30" width="6" height="5" rx="1" fill="#d1fae5"/>
  <rect x="42" y="30" width="6" height="5" rx="1" fill="#10b981"/>
  <!-- Calculator buttons row 2 -->
  <rect x="18" y="37" width="6" height="5" rx="1" fill="#d1fae5"/>
  <rect x="26" y="37" width="6" height="5" rx="1" fill="#d1fae5"/>
  <rect x="34" y="37" width="6" height="5" rx="1" fill="#d1fae5"/>
  <rect x="42" y="37" width="6" height="5" rx="1" fill="#10b981"/>
  <!-- Calculator buttons row 3 -->
  <rect x="18" y="44" width="6" height="5" rx="1" fill="#d1fae5"/>
  <rect x="26" y="44" width="6" height="5" rx="1" fill="#d1fae5"/>
  <rect x="34" y="44" width="6" height="5" rx="1" fill="#d1fae5"/>
  <rect x="42" y="44" width="14" height="5" rx="1" fill="#059669"/>
</svg>
